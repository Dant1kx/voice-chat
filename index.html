<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P2P Голосовая Связь</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1e1e24; margin: 0; color: #fff; }
        .card { background: #2a2a35; padding: 40px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); text-align: center; width: 85%; max-width: 500px; }
        h2 { margin-top: 0; font-size: 28px; }
        input { width: 100%; padding: 18px; margin: 20px 0; border: 2px solid #444; background: #1e1e24; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 18px; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 20px; margin-top: 10px; transition: 0.2s; }
        .btn-call { background: #28a745; color: white; }
        .btn-hangup { background: #dc3545; color: white; display: none; }
        .status { margin: 20px 0; font-size: 18px; color: #bbb; }
        #my-id { font-weight: bold; color: #007bff; font-size: 24px; display: block; margin-top: 5px; background: #1e1e24; padding: 10px; border-radius: 8px; }
    </style>
    <!-- Подключаем стабильную библиотеку звонков -->
    <script src="https://unpkg.com"></script>
</head>
<body>

<div class="card">
    <h2>Голосовой чат</h2>
    <div class="status">Ваш ID для связи: <span id="my-id">Получение ID...</span></div>
    
    <input type="text" id="peer-id" placeholder="Введите ID собеседника">
    
    <button id="call-btn" class="btn-call">Позвонить</button>
    <button id="hangup-btn" class="btn-hangup">Положить трубку</button>
    
    <div class="status" id="call-status">Ожидание вызова...</div>
</div>

<script src="app.js"></script>
</body>
</html>
