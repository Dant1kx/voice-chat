<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>P2P Голосовой Чат (РФ)</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a24; margin: 0; color: #fff; }
        .card { background: #242432; padding: 40px; border-radius: 20px; box-shadow: 0 8px 30px rgba(0,0,0,0.4); text-align: center; width: 85%; max-width: 480px; }
        h2 { margin-top: 0; font-size: 26px; color: #4dadff; }
        input { width: 100%; padding: 16px; margin: 20px 0; border: 2px solid #3d3d52; background: #1a1a24; color: #fff; border-radius: 10px; box-sizing: border-box; font-size: 18px; text-align: center; }
        input:focus { border-color: #007bff; outline: none; }
        button { width: 100%; padding: 16px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-size: 18px; margin-top: 10px; transition: 0.2s; }
        .btn-call { background: #28a745; color: white; }
        .btn-hangup { background: #dc3545; color: white; display: none; }
        .status { margin: 15px 0; font-size: 16px; color: #a0a0b8; }
        #my-id { font-weight: bold; color: #007bff; font-size: 22px; display: block; margin-top: 8px; background: #1a1a24; padding: 12px; border-radius: 8px; border: 1px dashed #007bff; }
    </style>
    <!-- Подключаем библиотеку Socket.io для связи через открытые порты -->
    <script src="https://socket.io"></script>
</head>
<body>

<div class="card">
    <h2>Голосовая Связь P2P</h2>
    <div class="status">Ваш ID для связи:<span id="my-id">Запуск сетевого моста...</span></div>
    
    <input type="text" id="peer-id" placeholder="Вставьте ID собеседника">
    
    <button id="call-btn" class="btn-call">Позвонить</button>
    <button id="hangup-btn" class="btn-hangup">Положить трубку</button>
    
    <div class="status" id="call-status">Ожидание сети...</div>
</div>

<script src="app.js"></script>
</body>
</html>
